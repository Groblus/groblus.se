name: Check site and Spelhyllan
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: "11.10.0"
      - run: pnpm install --frozen-lockfile
      - run: npm --prefix worker ci
      - run: npm run check
